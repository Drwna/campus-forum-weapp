      description: 0 student, 1 moderator, 2 admin
    UserStatus:
      type: integer
      enum: [0, 1]
    PostStatus:
      type: integer
      enum: [0, 1, 2, 3]
      description: 0 pending, 1 approved, 2 rejected, 3 deleted
    CommentStatus:
      type: integer
      enum: [0, 1, 2]
    ReportStatus:
      type: integer
      enum: [0, 1, 2, 3]
    TargetType:
      type: integer
      enum: [1, 2, 3]
