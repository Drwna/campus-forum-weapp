openapi: 3.0.3
info:
  title: CampusHub API
  version: 0.1.0
  description: API contract for the CampusHub mini-program, admin dashboard, and backend.
servers:
  - url: http://localhost:3001/api/v1
    description: Local development
security:
  - bearerAuth: []
tags:
  - name: Auth
  - name: User
  - name: Post
  - name: Comment
  - name: Interaction
  - name: Category
  - name: Message
  - name: File
  - name: Report
  - name: Admin
paths:
  /auth/wechat-login:
    post:
      tags: [Auth]
      summary: WeChat mini-program login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                  minLength: 1
      responses:
        "200":
          description: Login succeeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /auth/admin-login:
    post:
      tags: [Auth]
      summary: Admin dashboard login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [account, password]
              properties:
                account:
                  type: string
                password:
                  type: string
                  format: password
      responses:
        "200":
          description: Login succeeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh access token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
      responses:
        "200":
          description: Token refreshed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
  /auth/logout:
    post:
      tags: [Auth]
      summary: Logout and revoke token
      responses:
        "200":
          $ref: "#/components/responses/OkNull"
  /users/me:
    get:
      tags: [User]
      summary: Current user profile
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/User"
    put:
      tags: [User]
      summary: Update current user profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nickname:
                  type: string
                  maxLength: 64
                avatar:
                  type: string
                  nullable: true
                bio:
                  type: string
                  maxLength: 200
                  nullable: true
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/User"
  /users/{userId}:
    parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [User]
      summary: Public user profile
      security:
        - bearerAuth: []
        - {}
      responses:
        "200":
          description: Public user profile
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/User"
  /users/{userId}/posts:
    parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [User]
      summary: Public posts by user
      security:
        - bearerAuth: []
        - {}
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: Paged public posts by user
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/PostPage"
  /users/{userId}/followers:
    parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [User]
      summary: User followers
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: Paged followers
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/UserPage"
  /users/{userId}/following:
    parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [User]
      summary: Users followed by user
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: Paged followed users
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/UserPage"
  /categories:
    get:
      tags: [Category]
      summary: Enabled categories
      security: []
      responses:
        "200":
          description: Category list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Category"
  /posts:
    get:
      tags: [Post]
      summary: Approved post list
      security:
        - bearerAuth: []
        - {}
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
        - name: categoryId
          in: query
          schema:
            type: string
        - name: keyword
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Paged posts
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/PostPage"
    post:
      tags: [Post]
      summary: Create post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, content, categoryId]
              properties:
                title:
                  type: string
                  maxLength: 100
                content:
                  type: string
                categoryId:
                  type: string
                imageUrls:
                  type: array
                  maxItems: 9
                  items:
                    type: string
      responses:
        "200":
          description: Created as pending
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          postId:
                            type: string
                          status:
                            $ref: "#/components/schemas/PostStatus"
        "422":
          $ref: "#/components/responses/Unprocessable"
  /posts/mine:
    get:
      tags: [Post]
      summary: Current user's posts including pending and rejected
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/PostStatus"
      responses:
        "200":
          description: Paged posts
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/PostPage"
  /posts/{postId}:
    parameters:
      - $ref: "#/components/parameters/PostId"
    get:
      tags: [Post]
      summary: Post detail
      security:
        - bearerAuth: []
        - {}
      responses:
        "200":
          description: Post detail
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/PostDetail"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Post]
      summary: Update own post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  maxLength: 100
                content:
                  type: string
                categoryId:
                  type: string
                imageUrls:
                  type: array
                  maxItems: 9
                  items:
                    type: string
      responses:
        "200":
          $ref: "#/components/responses/OkNull"
        "403":
          $ref: "#/components/responses/Forbidden"
    delete:
      tags: [Post]
      summary: Soft delete own post
      responses:
        "200":
          $ref: "#/components/responses/OkNull"
  /posts/{postId}/comments:
    parameters:
      - $ref: "#/components/parameters/PostId"
    get:
      tags: [Comment]
      summary: Comments under a post
      security:
        - bearerAuth: []
        - {}
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: Paged comments
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/CommentPage"
    post:
      tags: [Comment]
      summary: Create comment or reply
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content:
                  type: string
                parentId:
                  type: string
                  nullable: true
                replyToUserId:
                  type: string
                  nullable: true
      responses:
        "200":
          description: Comment created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Comment"
  /comments/{commentId}:
    delete:
      tags: [Comment]
      summary: Delete own comment
      parameters:
        - name: commentId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          $ref: "#/components/responses/OkNull"
  /posts/{postId}/like:
    parameters:
      - $ref: "#/components/parameters/PostId"
    post:
      tags: [Interaction]
      summary: Like a post idempotently
      responses:
        "200":
          description: Current like state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InteractionStateResponse"
    delete:
      tags: [Interaction]
      summary: Unlike a post idempotently
      responses:
        "200":
          description: Current like state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InteractionStateResponse"
  /users/{userId}/follow:
    parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
    post:
      tags: [Interaction]
      summary: Follow user idempotently
      responses:
        "200":
          $ref: "#/components/responses/OkNull"
    delete:
      tags: [Interaction]
      summary: Unfollow user idempotently
      responses:
        "200":
          $ref: "#/components/responses/OkNull"
  /messages:
    get:
      tags: [Message]
      summary: Current user's inbox
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: Paged messages
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/MessagePage"
  /messages/unread-count:
    get:
      tags: [Message]
      summary: Current user's unread message count
      responses:
        "200":
          description: Unread count
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          count:
                            type: integer
  /messages/{messageId}/read:
    put:
      tags: [Message]
      summary: Mark one message as read
      parameters:
        - name: messageId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          $ref: "#/components/responses/OkNull"
  /messages/read-all:
    put:
      tags: [Message]
      summary: Mark all messages as read
      responses:
        "200":
          $ref: "#/components/responses/OkNull"
  /files/upload:
    post:
      tags: [File]
      summary: Upload image through backend
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                business:
                  type: string
                  enum: [avatar, post, notice]
      responses:
        "200":
          description: Uploaded file
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/File"
  /files/{fileId}:
    parameters:
      - name: fileId
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [File]
      summary: File metadata
      responses:
        "200":
          description: File metadata
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/File"
    delete:
      tags: [File]
      summary: Delete own uploaded file if not bound
      responses:
        "200":
          $ref: "#/components/responses/OkNull"
  /reports:
    post:
      tags: [Report]
      summary: Report content
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [targetType, targetId, reasonType]
              properties:
                targetType:
                  $ref: "#/components/schemas/TargetType"
                targetId:
                  type: string
                reasonType:
                  type: integer
                reasonText:
                  type: string
                  nullable: true
      responses:
        "200":
          $ref: "#/components/responses/OkNull"
  /admin/posts:
    get:
      tags: [Admin]
      summary: Admin post list
      description: Requires moderator or admin role.
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/PostStatus"
      responses:
        "200":
          description: Paged posts for moderation
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/PostPage"
        "403":
          $ref: "#/components/responses/Forbidden"
  /admin/posts/{postId}/status:
    put:
      tags: [Admin]
      summary: Approve or reject a post
      description: Requires moderator or admin role.
      parameters:
        - $ref: "#/components/parameters/PostId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  $ref: "#/components/schemas/PostStatus"
                rejectReason:
                  type: string
                  nullable: true
      responses:
        "200":
          $ref: "#/components/responses/OkNull"
  /admin/comments:
    get:
      tags: [Admin]
      summary: Admin comment list
      description: Requires moderator or admin role.
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
        - name: keyword
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Paged comments for moderation
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/CommentPage"
  /admin/comments/{commentId}:
    delete:
      tags: [Admin]
      summary: Hide or delete a comment
      description: Requires moderator or admin role.
      parameters:
        - name: commentId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          $ref: "#/components/responses/OkNull"
  /admin/users:
    get:
      tags: [Admin]
      summary: Admin user list
      description: Requires admin role.
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
        - name: role
          in: query
          schema:
            $ref: "#/components/schemas/UserRole"
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/UserStatus"
        - name: keyword
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Paged users
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/UserPage"
  /admin/users/{userId}/status:
    put:
      tags: [Admin]
      summary: Ban or unban a user
      description: Requires admin role.
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  $ref: "#/components/schemas/UserStatus"
      responses:
        "200":
          $ref: "#/components/responses/OkNull"
  /admin/categories:
    post:
      tags: [Admin]
      summary: Create category
      description: Requires admin role.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [categoryName]
              properties:
                categoryName:
                  type: string
                categoryDesc:
                  type: string
                  nullable: true
                sortOrder:
                  type: integer
      responses:
        "200":
          $ref: "#/components/responses/OkNull"
  /admin/categories/{categoryId}:
    put:
      tags: [Admin]
      summary: Update category
      description: Requires admin role.
      parameters:
        - name: categoryId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                categoryName:
                  type: string
                categoryDesc:
                  type: string
                  nullable: true
                sortOrder:
                  type: integer
                status:
                  type: integer
      responses:
        "200":
          $ref: "#/components/responses/OkNull"
    delete:
      tags: [Admin]
      summary: Delete category when empty
      description: Requires admin role.
      parameters:
        - name: categoryId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          $ref: "#/components/responses/OkNull"
        "409":
          $ref: "#/components/responses/Conflict"
  /admin/reports:
    get:
      tags: [Admin]
      summary: Admin report list
      description: Requires moderator or admin role.
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/ReportStatus"
        - name: targetType
          in: query
          schema:
            $ref: "#/components/schemas/TargetType"
      responses:
        "200":
          description: Paged reports
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/ReportPage"
  /admin/reports/{reportId}/status:
    put:
      tags: [Admin]
      summary: Update report handling result
      description: Requires moderator or admin role.
      parameters:
        - name: reportId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  $ref: "#/components/schemas/ReportStatus"
                handleResult:
                  type: string
                  nullable: true
      responses:
        "200":
          $ref: "#/components/responses/OkNull"
  /admin/logs:
    get:
      tags: [Admin]
      summary: Admin operation logs
      description: Requires admin role.
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: Paged admin logs
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/AdminLogPage"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    Size:
      name: size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
    PostId:
      name: postId
      in: path
      required: true
      schema:
        type: string
  responses:
    OkNull:
      description: Operation succeeded
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/ApiResponse"
              - type: object
                properties:
                  data:
                    nullable: true
    Unauthorized:
      description: Authentication failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Permission denied
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unprocessable:
      description: Content or business validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Resource conflict
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    ApiResponse:
      type: object
      required: [code, message, data, traceId]
      properties:
        code:
          type: integer
          example: 0
        message:
          type: string
          example: ok
        data: {}
        traceId:
          type: string
    ErrorResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponse"
        - type: object
          properties:
            data:
              nullable: true
    LoginResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponse"
        - type: object
          properties:
            data:
              type: object
              required: [token, refreshToken, expiresIn, user]
              properties:
                token:
                  type: string
                refreshToken:
                  type: string
                expiresIn:
                  type: integer
                user:
                  $ref: "#/components/schemas/User"
    User:
      type: object
      required: [userId, nickname, avatar, bio, role, status]
      properties:
        userId:
          type: string
        nickname:
          type: string
        avatar:
          type: string
          nullable: true
        bio:
          type: string
          nullable: true
        role:
          $ref: "#/components/schemas/UserRole"
        status:
          $ref: "#/components/schemas/UserStatus"
    Category:
      type: object
      required: [categoryId, categoryName, categoryDesc, sortOrder, status]
      properties:
        categoryId:
          type: string
        categoryName:
          type: string
        categoryDesc:
          type: string
          nullable: true
        sortOrder:
          type: integer
        status:
          type: integer
    PostListItem:
      type: object
      required: [postId, author, category, title, excerpt, imageUrls, likeCount, commentCount, viewCount, status, isTop, isLiked, createTime]
      properties:
        postId:
          type: string
        author:
          $ref: "#/components/schemas/User"
        category:
          $ref: "#/components/schemas/Category"
        title:
          type: string
        excerpt:
          type: string
        imageUrls:
          type: array
          items:
            type: string
        likeCount:
          type: integer
        commentCount:
          type: integer
        viewCount:
          type: integer
        status:
          $ref: "#/components/schemas/PostStatus"
        isTop:
          type: boolean
        isLiked:
          type: boolean
        createTime:
          type: string
          format: date-time
    PostDetail:
      allOf:
        - $ref: "#/components/schemas/PostListItem"
