            rejectReason:
              type: string
              nullable: true
            updateTime:
              type: string
              format: date-time
    Comment:
      type: object
      required: [commentId, postId, parentId, replyToUserId, author, content, likeCount, status, createTime]
      properties:
        commentId:
          type: string
        postId:
          type: string
        parentId:
          type: string
          nullable: true
        replyToUserId:
          type: string
          nullable: true
        author:
          $ref: "#/components/schemas/User"
        content:
          type: string
        likeCount:
          type: integer
        status:
          $ref: "#/components/schemas/CommentStatus"
        createTime:
          type: string
          format: date-time
        replies:
          type: array
          items:
            $ref: "#/components/schemas/Comment"
    File:
      type: object
      required: [fileId, url, thumbUrl, mimeType, sizeBytes, width, height, status]
      properties:
        fileId:
          type: string
        url:
          type: string
        thumbUrl:
          type: string
          nullable: true
        mimeType:
          type: string
        sizeBytes:
          type: integer
        width:
          type: integer
          nullable: true
        height:
          type: integer
          nullable: true
        status:
          type: integer
    Message:
      type: object
      required: [messageId, fromUser, type, targetType, targetId, content, isRead, createTime]
      properties:
        messageId:
          type: string
        fromUser:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/User"
        type:
          type: integer
        targetType:
          $ref: "#/components/schemas/TargetType"
        targetId:
          type: string
        content:
          type: string
          nullable: true
        isRead:
          type: boolean
        createTime:
          type: string
          format: date-time
    Report:
      type: object
      required: [reportId, reporterId, targetType, targetId, reasonType, reasonText, status, handleResult, createTime]
      properties:
        reportId:
          type: string
        reporterId:
          type: string
        targetType:
          $ref: "#/components/schemas/TargetType"
        targetId:
          type: string
        reasonType:
          type: integer
        reasonText:
          type: string
          nullable: true
        status:
          $ref: "#/components/schemas/ReportStatus"
        handleResult:
          type: string
          nullable: true
        createTime:
          type: string
          format: date-time
    AdminLog:
      type: object
      required: [logId, adminId, action, targetType, targetId, beforeJson, afterJson, createTime]
      properties:
        logId:
          type: string
        adminId:
          type: string
        action:
          type: string
        targetType:
          type: string
        targetId:
          type: string
          nullable: true
        beforeJson:
          nullable: true
        afterJson:
          nullable: true
        createTime:
          type: string
          format: date-time
    PageMeta:
      type: object
      required: [total, page, size, hasMore]
      properties:
        total:
          type: integer
        page:
          type: integer
        size:
          type: integer
        hasMore:
          type: boolean
    PostPage:
      allOf:
        - $ref: "#/components/schemas/PageMeta"
        - type: object
          required: [list]
          properties:
            list:
              type: array
              items:
                $ref: "#/components/schemas/PostListItem"
    UserPage:
      allOf:
        - $ref: "#/components/schemas/PageMeta"
        - type: object
          required: [list]
          properties:
            list:
              type: array
              items:
                $ref: "#/components/schemas/User"
    CommentPage:
      allOf:
        - $ref: "#/components/schemas/PageMeta"
        - type: object
          required: [list]
          properties:
            list:
              type: array
              items:
                $ref: "#/components/schemas/Comment"
    MessagePage:
      allOf:
        - $ref: "#/components/schemas/PageMeta"
        - type: object
          required: [list]
          properties:
            list:
              type: array
              items:
                $ref: "#/components/schemas/Message"
    ReportPage:
      allOf:
        - $ref: "#/components/schemas/PageMeta"
        - type: object
          required: [list]
          properties:
            list:
              type: array
              items:
                $ref: "#/components/schemas/Report"
    AdminLogPage:
      allOf:
        - $ref: "#/components/schemas/PageMeta"
        - type: object
          required: [list]
          properties:
            list:
              type: array
              items:
                $ref: "#/components/schemas/AdminLog"
    InteractionStateResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponse"
        - type: object
          properties:
            data:
              type: object
              required: [liked, likeCount]
              properties:
                liked:
                  type: boolean
                likeCount:
                  type: integer
